# This app holds real personal data behind a local login gate (see
# docs/security_design.md). The login gate is a single-user local
# convenience, not network-facing auth - so the server must never bind to
# anything but localhost. Streamlit's own default binds to all interfaces,
# which would expose the vault's login page to the LAN (or further, if the
# firewall allows it). Do not remove server.address without adding real
# network authentication in front of this app first.
[server]
address = "localhost"
headless = true

[browser]
gatherUsageStats = false

# Cohesive light theme. primaryColor matches the dashboard's categorical
# blue (dashboard.py's _SEQUENTIAL_BLUE) so accents, buttons, sliders and
# links read the same as the charts. The charts are designed for a light
# background (transparent paper over dark gridlines), so the theme is
# pinned to light rather than following the OS dark preference.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f9"
textColor = "#1f2328"
font = "sans serif"

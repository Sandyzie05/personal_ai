# This app holds real personal data behind a local login gate (see
# docs/security_design.md). The login gate is a single-user local
# convenience, not network-facing auth - so the server must never bind to
# anything but localhost. Streamlit's own default binds to all interfaces,
# which would expose the vault's login page to the LAN (or further, if the
# firewall allows it). Do not remove server.address without adding real
# network authentication in front of this app first.
[server]
address = "localhost"
headless = true

[browser]
gatherUsageStats = false

# Cohesive light theme pinned at server start as the default. primaryColor
# matches the dashboard's categorical blue (dashboard.py's _SEQUENTIAL_BLUE) so
# accents, buttons, sliders and links read the same as the charts.
#
# The pin is the *default* only: src/interface/theme.py injects a runtime dark
# mode on top of this when the user flips the "Dark mode" toggle in the
# sidebar, so per-session dark does not require restarting the server.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f9"
textColor = "#1f2328"
font = "sans serif"
